---
name: drover login
description: >-
  Log in to OpenBao with the GitHub OIDC token of the workflow. Write a kubeconfig with a short-lived
  ServiceAccount token for a Rancher project.
author: evil8io

branding:
  icon: log-in
  color: green

inputs:
  openbao-url:
    description: The `https` URL of OpenBao, without a path, for example `https://rancher-tokens.example.com`.
    required: true
  rancher-url:
    description: The `https` URL of Rancher, without a path, for example `https://rancher.example.com`.
    required: true
  cluster:
    description: The ID of the Rancher cluster, for example `c-m-4x2kq7bd`.
    required: true
  project:
    description: The ID of the Rancher project, for example `p-abc12`.
    required: true
  role:
    description: The project role of the token. The value is `project-owner`, `project-member`, or `read-only`.
    required: true
  statement:
    description: The name of the statement in the trust annotation of the project.
    required: true
  issuer:
    description: The name of the JWT issuer in OpenBao.
    required: false
    default: github
  audience:
    description: >-
      The audience of the OIDC token. The default is the OpenBao URL, which is also the default of
      `global.broker.audience` in the drover chart.
    required: false
  ttl:
    description: >-
      The lifetime of the token, for example `30m`. With an empty value, OpenBao uses the default lifetime
      of the token role.
    required: false
  namespace:
    description: The namespace of the kubeconfig context.
    required: false
  kubeconfig:
    description: The absolute path of the kubeconfig. The default is a new file under `RUNNER_TEMP`.
    required: false
  export-kubeconfig:
    description: >-
      With `true`, the action sets `KUBECONFIG` to the path of the kubeconfig for the later steps of the
      job.
    required: false
    default: "true"
  ca-certificate:
    description: >-
      One or more PEM certificates of the private CA that signed the TLS certificates of OpenBao and
      Rancher. For the requests to OpenBao, the action trusts only these certificates. The action writes
      the certificates into the kubeconfig for Rancher.
    required: false
  insecure-skip-tls-verify:
    description: >-
      With `true`, the action does not verify the TLS certificate of OpenBao. The action also writes
      `insecure-skip-tls-verify: true` into the kubeconfig for Rancher. Do not set it together with
      `ca-certificate`.
    required: false
    default: "false"

outputs:
  kubeconfig:
    description: The path of the kubeconfig.
  server:
    description: The URL of the cluster API through Rancher.
  token:
    description: The ServiceAccount token. The runner masks it in the log.
  expires-in:
    description: The lifetime of the token in seconds.

runs:
  using: node24
  main: dist/main.js
