[tools]
actionlint = "1.7.12"
"aqua:bats-core/bats-core" = "1.14.0"
jq = "1.8.2"
node = "24.22.3"
shellcheck = "0.11.0"

[env]
MISE_PIN = 1

[tasks.install]
description = "Install the npm packages of package-lock.json, without their install scripts"
run = "npm ci --ignore-scripts"

[tasks.build]
description = "Compile src/ to dist/"
depends = ["install"]
run = ["rm -rf dist", "node_modules/.bin/tsc"]

[tasks.lint]
description = "Lint the workflows and the shell scripts, and check the types of the TypeScript source"
depends = ["install"]
run = ["actionlint", "shellcheck tests/*.bash tests/*.bats", "node_modules/.bin/tsc --noEmit"]

[tasks.test]
description = "Run the bats tests against the mock server"
depends = ["build"]
run = "bats tests"
